<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAP & EARN - File Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @keyframes bounce-slow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .ad-btn { animation: bounce-slow 2s infinite; }
    </style>
</head>
<body class="pb-24">

    <div id="loader" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-400 animate-pulse">Syncing with Firebase...</p>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 pt-6">
        
        <div class="glass p-4 rounded-2xl mb-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img id="user-pfp" src="" class="w-10 h-10 rounded-full border border-blue-500">
                <div>
                    <p id="user-name" class="text-sm font-bold">User</p>
                    <p id="user-lvl" class="text-[10px] text-blue-400 uppercase tracking-tighter">Level 1</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-slate-400">BALANCE</p>
                <p class="text-xl font-black text-yellow-400"><span id="coin-count">0</span> 🪙</p>
            </div>
        </div>

        <div id="file-unlock-area" class="hidden glass border-yellow-500/50 p-6 rounded-2xl mb-8 text-center">
            <h2 class="text-lg font-bold text-yellow-500 mb-1">📥 File Requested</h2>
            <p class="text-xs text-slate-400 mb-6">Watch a quick ad to unlock your download link.</p>
            
            <button onclick="handleMonotagUnlock()" class="ad-btn w-full bg-yellow-500 hover:bg-yellow-400 text-black font-black py-4 rounded-xl transition-all shadow-lg shadow-yellow-500/20">
                WATCH AD & GET FILE 🔓
            </button>
        </div>

        <section id="tap-section" class="tab-content active text-center py-10">
            <div id="tap-btn" class="relative inline-block cursor-pointer active:scale-95 transition-transform">
                <img src="https://cryptologos.cc/logos/tether-usdt-logo.png" class="w-48 h-48 drop-shadow-[0_0_35px_rgba(34,197,94,0.4)]">
            </div>
            <p class="mt-10 text-slate-500 text-sm italic">Tap to mine coins while you wait!</p>
        </section>

        <section id="task-section" class="tab-content">
            <h3 class="font-bold text-xl mb-4">Daily Tasks</h3>
            <div id="task-list" class="space-y-3">
                </div>
        </section>

    </div>

    <nav class="fixed bottom-6 left-4 right-4 glass rounded-2xl flex justify-around py-3">
        <button onclick="showTab('tap-section')" class="flex flex-col items-center opacity-50 hover:opacity-100">
            <span>👆</span><span class="text-[10px]">Mine</span>
        </button>
        <button onclick="showTab('task-section')" class="flex flex-col items-center opacity-50 hover:opacity-100">
            <span>📋</span><span class="text-[10px]">Tasks</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. YOUR CONFIGS
        const firebaseConfig = {
            apiKey: "AIzaSyAig1dnwxJTSmxRmq77wfIL8C5hRSvo8Co",
            authDomain: "kannadamagaaearning.firebaseapp.com",
            projectId: "kannadamagaaearning",
            storageBucket: "kannadamagaaearning.firebasestorage.app",
            messagingSenderId: "812679666608",
            appId: "1:812679666608:web:cfe7659a0e7397f87c9475"
        };

        const MONOTAG_LINK = "https://your-monotag-direct-link.com/abc";
        const BOT_USER = "YourBotUsername"; 

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;

        let userData = { coins: 0, level: 1 };
        const fileId = tg.initDataUnsafe.start_param;

        // 2. Initialize App
        async function init() {
            tg.expand();
            const user = tg.initDataUnsafe.user || { id: "test_user", first_name: "Developer" };
            
            // UI Updates
            document.getElementById('user-name').innerText = user.first_name;
            document.getElementById('user-pfp').src = user.photo_url || "https://via.placeholder.com/100";
            
            if (fileId) document.getElementById('file-unlock-area').classList.remove('hidden');

            // Firebase Sync
            const userRef = doc(db, "users", String(user.id));
            const snap = await getDoc(userRef);
            
            if (snap.exists()) {
                userData = snap.data();
            } else {
                await setDoc(userRef, { ...userData, name: user.first_name });
            }

            updateDisplay();
            document.getElementById('loader').style.display = 'none';
        }

        function updateDisplay() {
            document.getElementById('coin-count').innerText = userData.coins.toLocaleString();
            document.getElementById('user-lvl').innerText = `Level ${Math.floor(userData.coins/1000) + 1}`;
        }

        // 3. Monotag Unlock Logic
        window.handleMonotagUnlock = async () => {
            tg.openLink(MONOTAG_LINK);
            
            tg.showConfirm("Did you finish watching the ad?", async (ok) => {
                if (ok) {
                    const userId = String(tg.initDataUnsafe.user.id);
                    // Save verification proof to Firebase
                    await setDoc(doc(db, "unlocked_files", `${userId}_${fileId}`), {
                        userId, fileId, timestamp: Date.now()
                    });

                    tg.showAlert("Success! Returning to Bot to send your file...");
                    setTimeout(() => {
                        tg.openTelegramLink(`https://t.me/${BOT_USER}?start=get_${fileId}`);
                        tg.close();
                    }, 1000);
                }
            });
        };

        // 4. Tap Logic
        document.getElementById('tap-btn').onclick = () => {
            userData.coins += 1;
            updateDisplay();
            updateDoc(doc(db, "users", String(tg.initDataUnsafe.user.id)), { coins: userData.coins });
        };

        window.showTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        init();
    </script>
</body>
</html>
