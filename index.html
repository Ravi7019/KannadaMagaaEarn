<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAP & EARN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/10.16.4/framer-motion.umd.min.js"></script>
    <style>
        @keyframes bounce-custom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .tap-animation { animation: bounce-custom 0.2s ease-in-out; }
        .coin-float {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }
        body { background-color: #0f172a; color: white; user-select: none; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="pb-20">

    <div id="loader" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900">
        <div class="text-xl animate-pulse">Loading TAP & EARN...</div>
    </div>

    <div id="app-container" class="max-w-md mx-auto px-4 pt-6">
        
        <div class="flex justify-between items-center mb-8 bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
            <div>
                <p class="text-xs text-slate-400 uppercase tracking-widest">Balance</p>
                <h1 class="text-2xl font-bold text-yellow-400"><span id="user-coins">0</span> 🪙</h1>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-400 uppercase tracking-widest">Level</p>
                <h2 class="text-xl font-bold text-blue-400" id="user-level">Lvl 1</h2>
            </div>
        </div>

        <section id="tap-earn" class="tab-content active text-center">
            <div class="relative flex flex-col items-center justify-center py-10">
                <div id="tap-area" class="relative cursor-pointer transition-transform active:scale-95">
                    <img src="https://cryptologos.cc/logos/tether-usdt-logo.png" alt="USDT" class="w-48 h-48 drop-shadow-[0_0_30px_rgba(34,197,94,0.5)]">
                </div>
                <p class="mt-8 text-slate-400">Tap the USDT to mine coins!</p>
            </div>
        </section>

        <section id="tasks" class="tab-content">
            <h2 class="text-xl font-bold mb-4 text-center">Available Tasks ✅</h2>
            <div id="task-list" class="space-y-3">
                </div>
        </section>

        <section id="withdrawal" class="tab-content">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <h2 class="text-xl font-bold mb-2">Exchange 💸</h2>
                <p class="text-sm text-slate-400 mb-4">Rate: <span id="rate-display">10,000</span> Coins = 1 USDT</p>
                
                <input id="wallet-address" type="text" placeholder="Enter USDT (TRC20) Address" class="w-full bg-slate-900 border border-slate-600 p-3 rounded-lg mb-4 outline-none focus:border-green-500">
                
                <button onclick="requestWithdrawal()" class="w-full bg-green-600 hover:bg-green-500 p-3 rounded-lg font-bold">Request Withdrawal</button>
            </div>
            <div class="mt-6">
                <h3 class="text-sm font-bold text-slate-400 mb-2">History</h3>
                <div id="withdraw-history" class="space-y-2 text-xs"></div>
            </div>
        </section>

        <section id="profile" class="tab-content text-center">
            <div id="user-info" class="flex flex-col items-center">
                <img id="pfp" src="https://via.placeholder.com/100" class="w-24 h-24 rounded-full border-4 border-slate-700 mb-4">
                <h2 id="username" class="text-2xl font-bold">Username</h2>
                <p id="tg-id" class="text-slate-500 text-sm">ID: 0000000</p>
            </div>
            <div class="mt-8 bg-slate-800 p-4 rounded-xl text-left">
                <p class="text-sm text-slate-400">Your Referral Link:</p>
                <div class="flex items-center gap-2 mt-2">
                    <input id="ref-link" readonly class="flex-1 bg-slate-900 p-2 text-xs rounded border border-slate-600" value="">
                    <button onclick="copyRef()" class="bg-blue-600 px-3 py-2 rounded text-xs">Copy</button>
                </div>
                <p class="text-[10px] text-blue-400 mt-2">+500 points per referral</p>
            </div>
        </section>

        <section id="admin-panel" class="hidden fixed inset-0 bg-slate-950 z-[100] p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-red-500">ADMIN DASHBOARD</h1>
                <button onclick="closeAdmin()" class="text-slate-400 underline">Exit</button>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-slate-800 p-4 rounded-xl">Total Users: <span id="admin-total-users">0</span></div>
                <div class="bg-slate-800 p-4 rounded-xl">Total Coins: <span id="admin-total-coins">0</span></div>
            </div>
            <h3 class="font-bold mb-2">Manage Withdrawals</h3>
            <div id="admin-withdrawals" class="space-y-2 mb-6"></div>
            <h3 class="font-bold mb-2">Manage Tasks</h3>
            <div id="admin-tasks" class="space-y-2"></div>
            <button onclick="addNewTask()" class="mt-4 bg-blue-600 p-2 rounded w-full">+ Add New Task</button>
        </section>

    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 flex justify-around py-3 px-2">
        <button onclick="switchTab('tap-earn')" class="flex flex-col items-center text-slate-400 hover:text-white">
            <span class="text-xl">👆</span><span class="text-[10px]">Tap</span>
        </button>
        <button onclick="switchTab('tasks')" class="flex flex-col items-center text-slate-400 hover:text-white">
            <span class="text-xl">📋</span><span class="text-[10px]">Tasks</span>
        </button>
        <button onclick="switchTab('withdrawal')" class="flex flex-col items-center text-slate-400 hover:text-white">
            <span class="text-xl">💰</span><span class="text-[10px]">Wallet</span>
        </button>
        <button onclick="switchTab('profile')" class="flex flex-col items-center text-slate-400 hover:text-white">
            <span class="text-xl">👤</span><span class="text-[10px]">Profile</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- PASTE YOUR FIREBASE CONFIG HERE ---
        const firebaseConfig = {
  apiKey: "AIzaSyAig1dnwxJTSmxRmq77wfIL8C5hRSvo8Co",
  authDomain: "kannadamagaaearning.firebaseapp.com",
  projectId: "kannadamagaaearning",
  storageBucket: "kannadamagaaearning.firebasestorage.app",
  messagingSenderId: "812679666608",
  appId: "1:812679666608:web:cfe7659a0e7397f87c9475"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Management
        let user = {
            id: 'local_user', // Fallback
            username: 'Guest',
            coins: 0,
            level: 1,
            referrals: 0,
            photo: 'https://via.placeholder.com/100'
        };

        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. Check if Admin (In browser, not in TG WebApp)
        if (!tg.initDataUnsafe.user) {
            document.getElementById('admin-panel').classList.remove('hidden');
            loadAdminData();
        }

        // 2. Initialize User
        async function init() {
            if (tg.initDataUnsafe.user) {
                const tgUser = tg.initDataUnsafe.user;
                user.id = tgUser.id.toString();
                user.username = tgUser.username || "Anon";
                user.photo = tgUser.photo_url || user.photo;
            }

            // LocalStorage First
            const cached = localStorage.getItem('userData');
            if (cached) {
                user = JSON.parse(cached);
                updateUI();
            }

            // Sync with Firebase
            const userRef = doc(db, "users", user.id);
            const snap = await getDoc(userRef);

            if (snap.exists()) {
                user = snap.data();
            } else {
                // New User
                await setDoc(userRef, user);
            }
            
            localStorage.setItem('userData', JSON.stringify(user));
            updateUI();
            document.getElementById('loader').style.display = 'none';
            loadTasks();
            syncWithdrawals();
        }

        // 3. Tapping Logic
        const tapArea = document.getElementById('tap-area');
        tapArea.addEventListener('click', (e) => {
            user.coins += 1;
            checkLevel();
            
            // Animation
            const rect = tapArea.getBoundingClientRect();
            const x = e.clientX || rect.left + rect.width/2;
            const y = e.clientY || rect.top + rect.height/2;
            showCoinPopup(x, y);

            updateUI();
            saveData();
        });

        function showCoinPopup(x, y) {
            const el = document.createElement('div');
            el.className = 'coin-float text-yellow-400 font-bold text-xl';
            el.innerText = '+1';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function checkLevel() {
            const newLevel = Math.floor(user.coins / 1000) + 1;
            if (newLevel > user.level) {
                user.level = newLevel;
                tg.HapticFeedback.notificationOccurred('success');
            }
        }

        // 4. Global UI/Data Update
        function updateUI() {
            document.getElementById('user-coins').innerText = user.coins.toLocaleString();
            document.getElementById('user-level').innerText = `Lvl ${user.level}`;
            document.getElementById('username').innerText = user.username;
            document.getElementById('tg-id').innerText = `ID: ${user.id}`;
            document.getElementById('pfp').src = user.photo;
            document.getElementById('ref-link').value = `https://t.me/YourBotName?start=${user.id}`;
        }

        async function saveData() {
            localStorage.setItem('userData', JSON.stringify(user));
            const userRef = doc(db, "users", user.id);
            await updateDoc(userRef, {
                coins: user.coins,
                level: user.level
            });
        }

        // 5. Tasks Logic
        async function loadTasks() {
            const taskContainer = document.getElementById('task-list');
            const q = query(collection(db, "tasks"));
            onSnapshot(q, (snapshot) => {
                taskContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const task = doc.data();
                    taskContainer.innerHTML += `
                        <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center border border-slate-700">
                            <div>
                                <h4 class="font-bold">${task.name}</h4>
                                <p class="text-xs text-green-400">+${task.reward} Coins</p>
                            </div>
                            <button onclick="verifyTask('${doc.id}', '${task.link}', ${task.reward})" class="bg-blue-600 px-4 py-2 rounded-lg text-sm font-bold">Go</button>
                        </div>
                    `;
                });
            });
        }

        window.verifyTask = async (id, link, reward) => {
            window.open(link, '_blank');
            // Simplified Verify Logic (In production, use a bot API check)
            setTimeout(async () => {
                if(confirm("Did you complete the task?")) {
                    user.coins += reward;
                    updateUI();
                    saveData();
                    alert("Reward Added!");
                }
            }, 2000);
        };

        // 6. Withdrawal Logic
        window.requestWithdrawal = async () => {
            const addr = document.getElementById('wallet-address').value;
            if (user.coins < 10000) return alert("Minimum 10,000 coins required!");
            if (!addr) return alert("Enter address!");

            const reqRef = doc(collection(db, "withdrawals"));
            await setDoc(reqRef, {
                userId: user.id,
                username: user.username,
                address: addr,
                amount: user.coins,
                status: 'Pending',
                timestamp: Date.now()
            });

            user.coins = 0;
            updateUI();
            saveData();
            alert("Request Submitted!");
        };

        function syncWithdrawals() {
            const q = query(collection(db, "withdrawals"), where("userId", "==", user.id));
            onSnapshot(q, (snapshot) => {
                const history = document.getElementById('withdraw-history');
                history.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const color = d.status === 'Approved' ? 'text-green-400' : (d.status === 'Rejected' ? 'text-red-400' : 'text-yellow-400');
                    history.innerHTML += `
                        <div class="bg-slate-900 p-2 rounded flex justify-between">
                            <span>${d.amount} 🪙</span>
                            <span class="${color}">${d.status}</span>
                        </div>
                    `;
                });
            });
        }

        // Admin Helpers
        async function loadAdminData() {
            // Summary stats
            const userQuery = await getDocs(collection(db, "users"));
            document.getElementById('admin-total-users').innerText = userQuery.size;
            
            // Real-time admin panels
            onSnapshot(collection(db, "withdrawals"), (snap) => {
                const cont = document.getElementById('admin-withdrawals');
                cont.innerHTML = '';
                snap.forEach(d => {
                    const data = d.data();
                    if(data.status === 'Pending') {
                        cont.innerHTML += `
                        <div class="bg-slate-900 p-2 text-xs flex justify-between items-center rounded">
                            <span>${data.username} - ${data.amount}</span>
                            <div>
                                <button onclick="updateStatus('${d.id}', 'Approved')" class="bg-green-600 px-2 py-1 rounded mr-1">Approve</button>
                                <button onclick="updateStatus('${d.id}', 'Rejected')" class="bg-red-600 px-2 py-1 rounded">Reject</button>
                            </div>
                        </div>`;
                    }
                });
            });
        }

        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, "withdrawals", id), { status });
        };

        // Navigation
        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        window.copyRef = () => {
            const link = document.getElementById('ref-link');
            link.select();
            document.execCommand('copy');
            alert("Referral link copied!");
        };

        window.closeAdmin = () => document.getElementById('admin-panel').classList.add('hidden');

        init();
    </script>
</body>
</html>
